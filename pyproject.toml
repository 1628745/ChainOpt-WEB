[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chainopt"
version = "0.1.0"
description = "ChainOpt SDK — log LLM calls to Supabase for pipeline optimization"
readme = "CLAUDE.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "supabase>=2.0",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
chainopt = "chainopt_analyze.entry:main"

[tool.setuptools.packages.find]
where = ["sdk", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["sdk", "cli"]
